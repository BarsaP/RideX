services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ridex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ridex
      POSTGRES_USER: ridex
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: