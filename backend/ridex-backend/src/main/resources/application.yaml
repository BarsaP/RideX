spring:
  application:
    name: ridex-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/ridex
    username: ridex
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-seconds: 900
  refresh-token-ttl-days: 30
